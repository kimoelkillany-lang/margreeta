<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margreeta — Marketing Site</title>
<link rel="stylesheet" href="styles.css">
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<script src="image-slot.js?v=3"></script>
<script src="GenZCartStore.js?v=2"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Bungee&family=Caveat:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
--surface-cream:#FC0000;--paper-white:#FFFFFF;--surface-deep-red:#FC0000;
--brand-red:#FF3D6E;--gold-foil:#FFB100;--gold-highlight:#FFE066;
--accent-italy:#17C97B;--accent-america:#FF3D6E;--accent-egypt:#7B5CFA;--accent-dessert:#FFB100;
--ink-black:#1A1333;--text-muted-on-light:#6B5E85;
--text-on-red:#FFFFFF;--text-on-red-muted:rgba(255,255,255,.82);
--border-hairline:#FFB100;--border-hairline-soft:rgba(255,224,102,.45);
--radius-sm:10px;--radius-md:22px;--radius-lg:34px;
--shadow-rest:0 4px 16px rgba(0,0,0,.18);--shadow-card:0 12px 30px rgba(0,0,0,.28);
--ease-bounce:cubic-bezier(.34,1.56,.64,1);--ease-smooth:cubic-bezier(.4,0,.2,1);
--font-display:'Lilita One',cursive;
--font-stamp:'Bungee',sans-serif;
--font-script:'Caveat',cursive;
--font-body:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;font-family:var(--font-body);background:var(--surface-cream)}
.gz-cart-fab{transition:transform .2s var(--ease-bounce)}
.gz-cart-fab:hover{transform:scale(1.08)}
.gz-back-fab{transition:transform .2s var(--ease-bounce)}
.gz-back-fab:hover{transform:translateY(-50%) scale(1.08)}
@keyframes gzCartBump{
0%{transform:scale(1) rotate(0deg)}
15%{transform:scale(1.3) rotate(-14deg)}
30%{transform:scale(1.34) rotate(11deg)}
45%{transform:scale(1.22) rotate(-9deg)}
60%{transform:scale(1.13) rotate(6deg)}
75%{transform:scale(1.05) rotate(-3deg)}
100%{transform:scale(1) rotate(0deg)}
}
.gz-cart-fab-bump{animation:gzCartBump .6s var(--ease-bounce)}
@keyframes gzChipIn{
0%{opacity:0;transform:scale(.3) translateY(-8px)}
60%{opacity:1}
100%{opacity:1;transform:scale(1) translateY(0)}
}
@keyframes gzScrimIn{
0%{opacity:0}
100%{opacity:1}
}
@keyframes gzChipFloat{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-8px)}
}
.gz-ordernow-scrim{animation:gzScrimIn .25s ease both}
@keyframes gzStampThud{
0%{opacity:0;transform:scale(.4) rotate(-25deg)}
55%{opacity:1;transform:scale(1.12) rotate(6deg)}
75%{transform:scale(.96) rotate(-3deg)}
100%{opacity:1;transform:scale(1) rotate(0deg)}
}
.gz-stamp-thud{animation:gzStampThud .6s var(--ease-bounce) both}
.gz-recommended-badge{overflow:hidden}
.gz-recommended-shine{position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(115deg, transparent, rgba(255,255,255,.7), transparent);transform:skewX(-20deg);animation:gzShine 3.2s ease-in-out infinite}
@keyframes gzShine{
0%{left:-60%}
35%{left:130%}
100%{left:130%}
}
@keyframes gzAddedPop{
0%{transform:scale(.94)}
60%{transform:scale(1.03)}
100%{transform:scale(1)}
}
.gz-dish-addbtn-added{animation:gzAddedPop .35s var(--ease-bounce)}
.gz-confirm-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle, rgba(255,177,0,.45), transparent 70%);animation:gzConfirmPulse 1.8s ease-in-out infinite}
@keyframes gzConfirmPulse{
0%,100%{transform:scale(1);opacity:.7}
50%{transform:scale(1.25);opacity:1}
}
.gz-nav-underline{position:absolute;bottom:2px;height:2px;border-radius:2px;background:var(--gold-foil);box-shadow:0 0 8px 0 var(--gold-foil);transition:left .3s var(--ease-bounce), width .3s var(--ease-bounce), opacity .2s ease;pointer-events:none}
.gz-stopcard-hint-icon{animation:gzTapPulse 1.4s ease-in-out infinite}
@keyframes gzTapPulse{
0%,100%{transform:scale(1);opacity:.85}
50%{transform:scale(1.18);opacity:1}
}
@media (max-width:800px){
.gz-nav-links{display:none!important}
.gz-nav-burger{display:flex!important}
.gz-nav-mobile-menu{display:flex!important}
nav{flex-wrap:wrap}
}
@media (max-width:720px) and (orientation: portrait){
:root{
--text-eyebrow:11px;
--text-body-sm:12px;
--text-body-md:14px;
--text-body-lg:16px;
--btn-fs-sm:11px;--btn-fs-md:13px;--btn-fs-lg:14px;
--btn-pad-sm:8px 14px;--btn-pad-md:11px 20px;--btn-pad-lg:12px 22px;
--tag-pad:4px 10px;
}
.gz-nav-mobile-menu{font-size:14px!important}
.gz-nav-menu-item{padding:10px 6px!important}
.gz-nav-logo{height:30px!important}
nav{padding:12px 16px!important}
section{padding-left:16px!important;padding-right:16px!important}
footer{padding:24px 16px!important}
.gz-hero-section{padding-top:40px!important;padding-bottom:44px!important}
.gz-hero-logo{width:150px!important}
.gz-hero-headline{font-size:21px!important;margin-top:20px!important}
.gz-hero-copy{font-size:13px!important}
.gz-script-accent{font-size:14px!important}
.gz-worldtour-section{padding-top:32px!important;padding-bottom:32px!important}
.gz-worldtour-grid{display:flex!important;overflow-x:auto!important;scroll-snap-type:x mandatory;gap:16px!important;padding:4px 16px 12px!important;margin-left:-16px!important;margin-right:-16px!important;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.gz-worldtour-grid::-webkit-scrollbar{display:none}
.gz-worldtour-item{flex:0 0 82%!important;scroll-snap-align:center}
.gz-concept-section{padding-top:26px!important;padding-bottom:26px!important}
.gz-section-heading{font-size:19px!important}
.gz-ingredient-row{gap:12px!important;padding:14px!important}
.gz-ingredient-img{width:52px!important;height:52px!important}
.gz-ingredient-badge{width:20px!important;height:20px!important;font-size:10px!important}
.gz-ingredient-title{font-size:14.5px!important;margin-bottom:3px!important}
.gz-ingredient-copy{font-size:12px!important}
.gz-stopcard{height:210px!important}
.gz-stopcard-title{font-size:15px!important}
.gz-stopcard-line{font-size:12.5px!important;margin-top:6px!important}
.gz-stopcard-back{padding:14px!important;gap:2px!important}
.gz-stopcard-country{font-size:16px!important}
.gz-stopcard-hint{font-size:12.5px!important;gap:5px!important}
.gz-stopcard-hint-icon{width:14px!important;height:14px!important}
.gz-stopcard-frontcue{font-size:10px!important;margin-top:8px!important;padding:5px 10px!important}
.gz-country-hero{padding-top:28px!important;padding-bottom:28px!important;gap:16px!important}
.gz-country-heading{font-size:23px!important}
.gz-country-line{font-size:14px!important}
.gz-dish-grid-section{padding-top:28px!important;padding-bottom:28px!important}
.gz-dish-name{font-size:16px!important}
.gz-dish-price{font-size:14px!important}
.gz-dish-addbtn{font-size:12.5px!important;padding:9px!important}
.gz-footer-logo{height:36px!important}
.gz-footer-text{font-size:11px!important}
.gz-cart-panel{padding:18px!important}
.gz-cart-title{font-size:20px!important}
.gz-cart-close{font-size:20px!important}
.gz-cart-item-name{font-size:13.5px!important}
.gz-cart-item-price{font-size:12px!important}
.gz-cart-total{font-size:15px!important}
.gz-cart-emoji{font-size:34px!important}
.gz-cart-confirm-main{font-size:14px!important}
.gz-cart-confirm-sub{font-size:12px!important}
.gz-cart-panel input{font-size:14px!important}
.gz-cart-panel label{font-size:11.5px!important}
.gz-cart-panel button:not(.gz-cart-close){font-size:13px!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components.js?v=2"></script>
<script type="text/babel" src="GenZNavBar.jsx?v=3"></script>
<script type="text/babel" src="GenZFooter.jsx?v=2"></script>
<script type="text/babel" src="GenZReveal.jsx?v=2"></script>
<script type="text/babel" src="GenZHome.jsx?v=5"></script>
<script type="text/babel" src="GenZCountryStop.jsx?v=2"></script>
<script type="text/babel" src="GenZCart.jsx?v=5"></script>
<script type="text/babel">
function App(){
  const [page, setPage] = React.useState('home');
  const handleNav = (target) => {
    if (target === 'concept') {
      setPage('home');
      requestAnimationFrame(() => setTimeout(() => {
        const el = document.getElementById('concept-section');
        if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 88, behavior: 'smooth' });
      }, 50));
    } else {
      setPage(target);
      window.scrollTo({ top: 0 });
    }
  };
  return (
    <div>
      <GenZNavBar current={page} onNav={handleNav} />
      {page === 'home' ? <GenZHome onNav={handleNav} /> : <GenZCountryStop country={page} onNav={handleNav} />}
      <GenZFooter />
      <GenZCart />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
